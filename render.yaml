services:
  - type: web
    name: resq-command-backend
    env: node
    plan: free
    region: oregon
    # backend/ is a self-contained package after the restructure: it owns its own
    # node_modules, so the install must run inside it, not at the repo root.
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
